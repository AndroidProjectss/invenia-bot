<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Invenia Support</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font:15px Inter,system-ui,sans-serif;color:#172033}.card{width:min(420px,calc(100% - 32px));background:#fff;padding:32px;border-radius:22px;box-shadow:0 18px 45px rgba(39,55,122,.14)}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#2563eb;color:#fff;font-weight:800;font-size:20px}h1{margin:20px 0 6px;font-size:26px}p{color:#748094;margin:0 0 24px}label{font-weight:650;display:block;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #dce1ec;border-radius:12px;font:inherit;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer}.flash{padding:10px 12px;margin-bottom:16px;border-radius:10px;background:#fee2e2;color:#991b1b}
  </style>
</head>
<body><main class="card"><div class="logo">IN</div><h1>Invenia Support</h1><p>Вход в панель оператора</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash">{{ message }}</div>{% endfor %}<form method="post"><label for="password">Пароль администратора</label><input id="password" name="password" type="password" required autofocus><button>Войти</button></form></main></body>
</html>
