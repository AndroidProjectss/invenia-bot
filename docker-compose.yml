services:
  bot:
    build: .
    container_name: invenia-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADMIN_HOST: 0.0.0.0
      BOT_DB_PATH: /app/data/invenia.sqlite3
    ports:
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    volumes:
      - ./data:/app/data
    networks:
      - default
      - talent

networks:
  talent:
    external: true
    name: deploy_default
